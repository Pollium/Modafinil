services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: modafinil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: modafinil
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:7-alpine

  api:
    build:
      context: .
      dockerfile: packages/apps/api/Dockerfile
    environment:
      PORT: 3004
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      DATABASE_URL: postgres://modafinil:${POSTGRES_PASSWORD}@postgres:5432/modafinil
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONITORS: >-
        [{"id":"learn","name":"Learn","url":"https://learn.pollium.io","blurb":"learn.pollium.io"},
        {"id":"console","name":"Console","url":"https://admin.learn.pollium.io","blurb":"admin.learn.pollium.io"},
        {"id":"tower","name":"Tower","url":"https://tower.pollium.io","blurb":"tower.pollium.io"},
        {"id":"learn-api","name":"Learn API","url":"https://api.learn.pollium.io/health","blurb":"api.learn.pollium.io"},
        {"id":"iam","name":"IAM","url":"https://iam.pollium.io","blurb":"iam.pollium.io"},
        {"id":"iam-server","name":"IAM Server","url":"https://server.iam.pollium.io/health","blurb":"server.iam.pollium.io"},
        {"id":"gateway","name":"AI Gateway","url":"https://gateway.pollium.io/health","blurb":"gateway.pollium.io"},
        {"id":"mail","name":"Mail","url":"https://mail.pollium.io","blurb":"mail.pollium.io"},
        {"id":"storage","name":"Storage","url":"https://storage.pollium.io/health/ready","blurb":"storage.pollium.io"}]
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: packages/apps/web/Dockerfile
      args:
        VITE_STATUS_NAME: Pollium
    ports:
      - "80"
    depends_on:
      - api

volumes:
  postgres-data:
