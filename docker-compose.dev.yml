name: modafinil-dev

services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5444:5432"
    environment:
      POSTGRES_USER: modafinil
      POSTGRES_PASSWORD: modafinil
      POSTGRES_DB: modafinil
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modafinil -d modafinil"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6391:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
