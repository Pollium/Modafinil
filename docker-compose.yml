name: modafinil

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: modafinil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: modafinil
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modafinil -d modafinil"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: packages/apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3004"
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      DATABASE_URL: postgres://modafinil:${POSTGRES_PASSWORD}@postgres:5432/modafinil
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MONITORS: >-
        [{"id":"website","name":"Website","url":"https://example.com","blurb":"example.com"},
        {"id":"api","name":"API","url":"http://api:3004/health","blurb":"this stack"}]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: packages/apps/web/Dockerfile
      args:
        VITE_STATUS_NAME: Example
    restart: unless-stopped
    ports:
      - "${MODAFINIL_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres-data:
